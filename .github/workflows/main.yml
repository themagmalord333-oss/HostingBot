name: Local Host Manager Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: local-manager-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 355 minute baad automatically stop hoga taaki GitHub block na kare

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl unzip jq git nodejs

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Pyrogram, tgcrypto aur AI scanner package direct install kar lo
          pip install pyrogram tgcrypto google-generativeai
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Local Manager Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # <--- Ye raha AI Key
        run: |
          echo "=========================================="
          echo "       STARTING LOCAL HOST MANAGER"
          echo "=========================================="
          python3 main.py