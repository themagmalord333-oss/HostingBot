name: AnySnap Master Node

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyrogram tgcrypto pymongo docker psutil requests gridfs

      - name: Run Node
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          GH_PERSONAL_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
          GITHUB_REPO: ${{ secrets.REPO_NAME }}
          WORKFLOW_FILE: ${{ secrets.WORKFLOW_FILE }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          NODE_ID: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          echo "======================================"
          echo "🚀 ANYSNAP CLOUD STARTING"
          echo "======================================"

          echo "Python version:"
          python --version

          echo ""
          echo "Checking main.py..."
          test -f main.py && echo "✅ main.py found" || { echo "❌ main.py missing"; exit 1; }

          echo ""
          echo "Starting main.py..."
          echo "======================================"

          python -u main.py