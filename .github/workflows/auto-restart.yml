name: Auto Restart Runner

on:
  workflow_run:
    workflows:
      - "Ultimate Deployer & Runner"
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: hosted-bot-auto-restart
  cancel-in-progress: false

jobs:
  restart-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Wait For Previous Runner
        run: |
          echo "Previous runner completed."
          echo "Waiting 30 seconds..."
          sleep 30

      - name: Check Existing Bot Runs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          RUNNING=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "main.yml" \
            --status in_progress \
            --json databaseId \
            --jq 'length')

          QUEUED=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "main.yml" \
            --status queued \
            --json databaseId \
            --jq 'length')

          echo "Running: $RUNNING"
          echo "Queued: $QUEUED"

          if [ "$RUNNING" -gt 0 ] || [ "$QUEUED" -gt 0 ]; then
            echo "Another run already exists."
            echo "start=false" >> "$GITHUB_OUTPUT"
          else
            echo "No existing run found."
            echo "start=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Next Bot Run
        if: steps.check.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Starting next bot run..."

          gh workflow run "main.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"

          echo "Next run started successfully."

      - name: No Restart Needed
        if: steps.check.outputs.start == 'false'
        run: |
          echo "A bot run is already queued or running."
          echo "Skipping duplicate restart."