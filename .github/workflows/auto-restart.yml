name: Auto Restart Local Manager

on:
  workflow_run:
    workflows:
      - "Local Host Manager Runner" # Ye main.yml ke 'name' se match hona chahiye
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'timed_out'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Wait for Previous Run to Fully Close
        run: |
          echo "Previous Local Manager run completed."
          echo "Waiting 30 seconds to clear processes..."
          sleep 30

      - name: Start Next Local Manager Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting next Local Manager run..."

          # Ye seedha aapki main.yml file ko target karke restart karega
          gh workflow run main.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"

          echo "Next Local Manager run started successfully."